[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-server"
version = "0.1.0"
description = "Streaming STT service (sherpa-onnx) per CONTRACT_STT_STREAM v1"
requires-python = ">=3.11"
dependencies = ["websockets>=17,<18", "sherpa-onnx>=1.13.8,<2", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["coverage==7.16.2", "pyright==1.1.414", "ruff==0.17.0"]

[project.scripts]
stt-server = "stt_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["src/stt_server"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["stt_server"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:", '\\.\\.\\.']
