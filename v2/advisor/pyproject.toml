[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-advisor"
version = "0.1.0"
description = "Consume meeting transcripts and provide model-backed advice"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
advisor = "feishu_meeting_adviser.__main__:main"
meeting-adviser-harness = "meeting_adviser_harness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feishu_meeting_adviser = ["meeting_adviser.md"]
