[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-meeting-adviser"
version = "0.1.0"
description = "Durable Feishu meeting transcript input source"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
meeting-transcripts = "feishu_meeting_adviser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feishu_meeting_adviser = ["meeting_adviser.md"]
