[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-meeting-workspace"
version = "0.1.0"
description = "Development tools for the listener and advisor workspace"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
    "coverage==7.16.2",
    "pyright==1.1.414",
    "ruff==0.17.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Start with correctness rules that do not require a repository-wide style rewrite.
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = [
    "advisor/src/feishu_meeting_adviser/models.py",
    "advisor/src/feishu_meeting_adviser/adapters/persistence",
    "advisor/src/feishu_meeting_adviser/adviser.py",
    "advisor/src/feishu_meeting_adviser/decision.py",
    "advisor/src/feishu_meeting_adviser/material_bootstrap.py",
    "advisor/src/feishu_meeting_adviser/model_jobs.py",
    "advisor/src/feishu_meeting_adviser/reply_dispatcher.py",
    "advisor/src/feishu_meeting_adviser/snapshot.py",
    "meeting-listener/src/meeting_listener/models.py",
    "meeting-listener/src/meeting_listener/adapters/persistence",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["meeting_listener", "feishu_meeting_adviser", "meeting_adviser_harness"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    '\.\.\.',
]
