[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-listener"
version = "0.1.0"
description = "Feishu meeting join and durable transcript collection"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
meeting-listener = "meeting_listener.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_listener = ["meeting_adviser.md"]
