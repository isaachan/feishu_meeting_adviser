# 产品配置示例：仅在没有 config.yaml 时复制，已有本机配置不要覆盖。
# 旧 app/lookup.meeting_no/join.password/probe.timeout_seconds 可直接读取；旧 stream 设置不用于产品。
app:
  id: ""
  secret: ""
meeting:
  meeting_no: ""                       # 9 位会议号，加引号保留前导 0
  password: ""
http:
  timeout_seconds: 10
  request_seconds: 0.7           # 每次 HTTP 请求最短间隔；events 文档上限 100 次/分钟
collector:
  initial_lookback_seconds: 600   # 首次回看范围，更早内容不自动采集
  overlap_seconds: 120
  page_size: 100
  max_pages_per_cycle: 10
  reconcile_seconds: 60          # 周期从初始起点回扫，长会议可能增加追赶时间
runtime:
  poll_seconds: 0.7              # 正常扫描一轮后等待 0.7 秒，另计请求/处理耗时
  cooldown_seconds: 30           # 快速重试耗尽后低频恢复探测
storage:
  directory: "data"              # 相对于配置文件；目录 700，资料文件 600
  content_capacity_bytes: 100000000
  database_capacity_bytes: 150000000
  retention_days: 7
  diagnostic_bytes: 1000000
  diagnostic_backups: 3

# 阶段 2：旧配置省略 llm 时保留固定规则，使用 Codex 时选择 codex。
llm:
  backend: codex
  executable: codex
  model: ""                      # 空值沿用当前 Codex 默认模型
  role_file: ""                  # 空值使用包内 meeting_adviser.md；可设本机 Markdown 路径
  timeout_seconds: 90
  batch_seconds: 2
  context_characters: 30000
  freshness_seconds: 120         # 原始发言结束/事件时间的新鲜度范围；未知时间不当作新鲜
  reply_interval_seconds: 10
  introduction: true

# 2.5：显式绑定日程实例；两个 ID 都留空时关闭材料读取。
# 先按 docs/USER_OAUTH.md 授权并按 docs/CONTEXT_PROBE.md 核对 ID。
meeting_context:
  calendar_id: ""
  event_id: ""                    # 重复日程须填本次实例 ID
  identity: user                  # user 或 application；失败不会切换身份
  context_characters: 10000       # 材料文本预算，仍受上方模型总上下文预算约束
  max_documents: 10
  timeout_seconds: 60
  binding_tolerance_seconds: 3600 # 入会时间须在日程开始前/结束后此范围内
  preview_bytes: 1000000          # 每会议内容预览当前文件上限
  preview_backups: 3
