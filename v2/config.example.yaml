# 复制为 config.yaml（已被 Git 忽略）；不要提交 App Secret 或会议 ID。
app:
  id: ""                 # 自建应用 App ID
  secret: ""             # 自建应用 App Secret
lookup:
  meeting_no: ""          # 9 位会议号，务必加引号以保留前导 0
join:
  password: ""            # 如会议设置了密码，请填写；没设密码则留空
probe:
  # 先运行 stage0.py join；probe 自动使用 bots/join 返回的内部 ID
  max_pages: 3           # 单次探测页数上限，避免无界访问
  timeout_seconds: 10
