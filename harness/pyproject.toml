[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-harness"
version = "0.1.0"
description = "Interactive REPL harness feeding simulated meeting captions to llm-gateway"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pyright==1.1.414", "ruff==0.17.0"]

[project.scripts]
llm-harness = "harness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["src/harness"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
