<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会参谋 · 运维台</title>
<style>
  :root {
    --bg: #101418; --panel: #171d24; --border: #2a3340; --fg: #dbe4ee;
    --dim: #8a98a8; --accent: #4da3ff; --green: #3fbf6f; --orange: #e0a03c;
    --red: #e05c5c; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px;
           border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #advisor-state { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
  .dot.ok { background: var(--green); } .dot.bad { background: var(--red); }
  nav { margin-left: auto; display: flex; gap: 4px; }
  nav button { background: none; border: 1px solid transparent; color: var(--dim);
               padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  nav button.active { color: var(--fg); background: var(--bg);
                      border-color: var(--border); }
  main { padding: 16px 18px; max-width: 1200px; margin: 0 auto; }
  .toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
             color: var(--dim); font-size: 13px; flex-wrap: wrap; }
  .toolbar label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .toolbar .spacer { flex: 1; }
  .btn { background: var(--panel); border: 1px solid var(--border); color: var(--fg);
         padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn.danger { color: #ff8f8f; }
  #banner { display: none; margin-bottom: 12px; padding: 7px 12px; border-radius: 6px;
            font-size: 13px; }
  #banner.err { display: block; background: #3a1f22; color: #ffb3b3; }
  #banner.ok { display: block; background: #1d3226; color: #a9e8bd; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border);
           white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; }
  td.title { white-space: normal; min-width: 140px; }
  td.mono, .mono { font-family: var(--mono); font-size: 12px; }
  .badge { padding: 1px 9px; border-radius: 10px; font-size: 12px; }
  .badge.running { background: #16351f; color: var(--green); }
  .badge.paused { background: #2c2a3f; color: #b3a6e8; }
  .badge.draining { background: #3a2d14; color: var(--orange); }
  .badge.ended { background: #262c33; color: var(--dim); }
  .badge.approved, .badge.on { background: #16351f; color: var(--green); }
  .badge.requested { background: #3a2d14; color: var(--orange); }
  .badge.denied, .badge.revoked, .badge.owner_revoked,
  .badge.subscriber_cancelled { background: #33202a; color: #c98fa4; }
  .badge.expired, .badge.off, .badge.unresolved { background: #262c33; color: var(--dim); }
  #grant-form { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  #grant-form input { background: var(--bg); border: 1px solid var(--border);
    color: var(--fg); border-radius: 6px; padding: 5px 10px; font-size: 13px;
    font-family: var(--mono); width: 240px; }
  #view-settings input { background: var(--bg); border: 1px solid var(--border);
    color: var(--fg); border-radius: 6px; padding: 5px 10px; font-size: 13px;
    font-family: var(--mono); width: 120px; }
  .hint { color: var(--dim); font-size: 12px; white-space: normal; margin-top: 2px; }
  td.subs { white-space: normal; min-width: 180px; }
  td.subs .sub { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #log-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  #log-tabs button { background: var(--panel); border: 1px solid var(--border);
                     color: var(--dim); padding: 4px 14px; border-radius: 6px;
                     cursor: pointer; font-size: 13px; font-family: var(--mono); }
  #log-tabs button.active { color: var(--fg); border-color: var(--accent); }
  #log-tabs button .dot { margin-left: 6px; }
  #log-box { background: #0b0e12; border: 1px solid var(--border); border-radius: 8px;
             padding: 10px 12px; height: calc(100vh - 210px); overflow: auto; }
  #log-box pre { margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.55;
                 white-space: pre-wrap; word-break: break-all; color: #b7c4d4; }
  #empty { color: var(--dim); font-size: 13px; padding: 30px; text-align: center; }
  td.ops { display: flex; gap: 6px; align-items: center; }
  #export-menu { position: fixed; z-index: 30; display: flex; flex-direction: column;
                  background: var(--panel); border: 1px solid var(--border);
                  border-radius: 8px; padding: 4px; box-shadow: 0 6px 24px #0009; }
  #export-menu button { background: none; border: none; color: var(--fg); cursor: pointer;
                        text-align: left; padding: 6px 14px; border-radius: 6px;
                        font-size: 13px; font-family: var(--mono); }
  #export-menu button:hover { background: var(--bg); color: var(--accent); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>会参谋 · 运维台</h1>
  <span id="advisor-state"><span class="dot" id="advisor-dot"></span><span id="advisor-text">advisor 检查中…</span></span>
  <nav>
    <button id="tab-sessions" class="active">会话</button>
    <button id="tab-grants">Supervisor</button>
    <button id="tab-settings">设置</button>
    <button id="tab-logs">日志</button>
  </nav>
</header>
<main>
  <div id="banner"></div>

  <section id="view-sessions">
    <div class="toolbar">
      <label><input type="checkbox" id="auto-refresh" checked>自动刷新（5s）</label>
      <button class="btn" id="refresh">立即刷新</button>
      <span id="session-count"></span>
    </div>
    <table>
      <thead><tr>
        <th>会话</th><th>会议号</th><th>标题</th><th>状态</th><th>会话 owner</th>
        <th>日历组织者</th><th>订阅者</th><th>开始时间</th><th>结束/排空截止</th><th>操作</th>
      </tr></thead>
      <tbody id="session-rows"></tbody>
    </table>
    <div id="empty" class="hidden">暂无会话</div>
  </section>

  <section id="view-grants" class="hidden">
    <div class="toolbar">
      <span>名单内的用户可以「受邀请参与者」身份启动会参谋（准入还要求命中该场日历邀请名单）。
      名单是 owner 权限面：仅受信网络内使用。</span>
    </div>
    <div id="grant-form">
      <input id="grant-login" placeholder="账号标识，如 kai.han（或完整邮箱 / ou_ 开头 open_id）">
      <button class="btn" id="grant-add">启用</button>
    </div>
    <table>
      <thead><tr><th>账号</th><th>open_id</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead>
      <tbody id="grant-rows"></tbody>
    </table>
    <div id="grant-empty" class="hidden">名单为空</div>
  </section>

  <section id="view-settings" class="hidden">
    <div class="toolbar">
      <span>运行参数在 advisor 持久化，重启后保留；修改仅对此后新建的会话生效，已建会话保持建会时的值。</span>
    </div>
    <table>
      <thead><tr><th>参数</th><th>当前值</th><th>新值</th><th>默认值</th><th>最近修改</th><th>操作</th></tr></thead>
      <tbody>
        <tr>
          <td>无音频排空阈值（秒）<div class="hint">连续无真实音频达到该时长，会话进入 draining</div></td>
          <td class="mono" id="idle-current">—</td>
          <td><input type="number" id="idle-input" min="60" max="86400" step="1"></td>
          <td class="mono" id="idle-default">—</td>
          <td id="idle-updated">—</td>
          <td><button class="btn" id="idle-save">保存</button></td>
        </tr>
      </tbody>
    </table>
  </section>

  <section id="view-logs" class="hidden">
    <div id="log-tabs"></div>
    <div class="toolbar">
      <button class="btn" id="pause">暂停</button>
      <button class="btn" id="clear">清屏</button>
      <label><input type="checkbox" id="autoscroll" checked>自动滚动</label>
      <span class="spacer"></span>
      <span id="log-state" class="mono"></span>
    </div>
    <div id="log-box"><pre id="log-pane"></pre></div>
  </section>
</main>

<div id="export-menu" class="hidden">
  <button data-format="json">导出 JSON</button>
  <button data-format="txt">导出 TXT</button>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const fmtTs = (v) => v == null ? '—' : new Date(v * 1000).toLocaleString('zh-CN', { hour12: false });

let bannerTimer = null;
function banner(kind, text) {
  const el = $('banner');
  el.className = kind;
  el.textContent = text;
  clearTimeout(bannerTimer);
  if (kind === 'ok') bannerTimer = setTimeout(() => { el.className = ''; }, 4000);
}

/* ---------------- sessions ---------------- */
let sessionsTimer = null;

async function loadSessions(manual) {
  let data = null;
  try {
    const resp = await fetch('api/sessions');
    data = await resp.json();
    if (!resp.ok) throw new Error((data.error && data.error.message) || resp.status);
  } catch (err) {
    setAdvisor(false);
    if (manual) banner('err', '获取会话失败：' + err.message);
    return;
  }
  setAdvisor(true);
  const rows = data.sessions || [];
  $('session-count').textContent = `共 ${rows.length} 个会话`;
  const tbody = $('session-rows');
  tbody.innerHTML = '';
  for (const s of rows) {
    const tr = document.createElement('tr');
    const endable = s.phase === 'running' || s.phase === 'paused' || s.phase === 'draining';
    const endText = s.ended_at ? fmtTs(s.ended_at)
      : (s.phase === 'draining' && s.drain_deadline_at)
          ? `截止 ${fmtTs(s.drain_deadline_at)}${s.drain_forced_reason
              ? '（已强制收尾：' + escapeHtml(s.drain_forced_reason) + '）' : ''}`
          : '—';
    tr.innerHTML =
      `<td class="mono">${s.session_id}</td>` +
      `<td class="mono">${s.meeting_no || '—'}</td>` +
      `<td class="title">${escapeHtml(s.title || '')}</td>` +
      `<td><span class="badge ${s.phase}">${s.phase}</span></td>` +
      ownerCell(s) +
      organizerCell(s) +
      subsCell(s) +
      `<td>${fmtTs(s.started_at)}</td>` +
      `<td>${endText}</td>` +
      `<td class="ops"><button class="btn" data-export="${s.session_id}">导出文字记录</button>` +
      `<button class="btn" data-timings="${s.session_id}">耗时</button>` +
      (endable ? `<button class="btn danger" data-end="${s.session_id}" ` +
        `data-title="${escapeHtml(s.title || s.session_id)}">结束</button>` : '') + '</td>';
    tbody.appendChild(tr);
  }
  $('empty').classList.toggle('hidden', rows.length > 0);
  for (const btn of tbody.querySelectorAll('button[data-end]')) {
    btn.onclick = () => endSession(btn.dataset.end, btn.dataset.title);
  }
  for (const btn of tbody.querySelectorAll('button[data-export]')) {
    btn.onclick = () => openExportMenu(btn);
  }
  for (const btn of tbody.querySelectorAll('button[data-timings]')) {
    btn.onclick = () => exportTimings(btn.dataset.timings);
  }
}

async function endSession(id, title) {
  if (!confirm(`确定结束会话 ${id}「${title}」？\n会话将进入 draining 排空后自动 ended。`)) return;
  try {
    const resp = await fetch(`api/sessions/${encodeURIComponent(id)}/end`, { method: 'POST' });
    const body = await resp.json();
    if (!resp.ok) throw new Error((body.error && body.error.message) || resp.status);
    banner('ok', `已停止 ${id}（phase=${body.phase}）`);
  } catch (err) {
    banner('err', '停止失败：' + err.message);
  }
  loadSessions(false);
}

/* ---------------- transcript export ---------------- */
let exportSessionId = null;

function openExportMenu(btn) {
  exportSessionId = btn.dataset.export;
  const menu = $('export-menu');
  const rect = btn.getBoundingClientRect();
  menu.style.top = rect.bottom + 4 + 'px';
  menu.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 140)) + 'px';
  menu.classList.remove('hidden');
}

function hideExportMenu() { $('export-menu').classList.add('hidden'); }

async function exportTranscript(id, format) {
  let data = null;
  try {
    const resp = await fetch(`api/sessions/${encodeURIComponent(id)}/transcript`);
    data = await resp.json();
    if (!resp.ok) throw new Error((data.error && data.error.message) || resp.status);
  } catch (err) {
    banner('err', '获取文字记录失败：' + err.message);
    return;
  }
  const records = (data.records || []).map((r) => ({
    time: r.time,
    time_text: r.time == null ? null : new Date(r.time * 1000)
      .toLocaleString('zh-CN', { hour12: false }),
    speaker: r.type === 'llm' ? 'LLM' : (r.speaker || '未识别'),
    text: r.text,
  }));
  let content, mime;
  if (format === 'json') {
    content = JSON.stringify({
      session_id: data.session_id, meeting_no: data.meeting_no, title: data.title,
      exported_at: new Date().toLocaleString('zh-CN', { hour12: false }),
      records,
    }, null, 2);
    mime = 'application/json';
  } else {
    const head = [
      `会参谋 · 文字记录`,
      `会话 ${data.session_id} · 会议 ${data.meeting_no || '—'} · ${data.title || '无标题'}`,
      `导出时间 ${new Date().toLocaleString('zh-CN', { hour12: false })} · 共 ${records.length} 条`,
      '',
    ];
    content = head.concat(records.map((r) =>
      `[${r.time_text || '时间未知'}] ${r.speaker}: ${r.text}`)).join('\n');
    mime = 'text/plain';
  }
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([content], { type: mime + ';charset=utf-8' }));
  link.download = `transcript-${id}.${format}`;
  link.click();
  URL.revokeObjectURL(link.href);
  banner('ok', `已导出 ${id} 文字记录（${records.length} 条，${format.toUpperCase()}）`);
}

async function exportTimings(id) {
  let data = null;
  try {
    const resp = await fetch(`api/sessions/${encodeURIComponent(id)}/timings`);
    data = await resp.json();
    if (!resp.ok) throw new Error((data.error && data.error.message) || resp.status);
  } catch (err) {
    banner('err', '获取耗时数据失败：' + err.message);
    return;
  }
  const measured = (data.jobs || []).filter((j) => j.timings);
  const content = JSON.stringify({
    session_id: data.session_id, meeting_no: data.meeting_no, title: data.title,
    exported_at: new Date().toLocaleString('zh-CN', { hour12: false }),
    jobs_total: (data.jobs || []).length, jobs_measured: measured.length,
    jobs: data.jobs,
  }, null, 2);
  const link = document.createElement('a');
  link.href = URL.createObjectURL(
    new Blob([content], { type: 'application/json;charset=utf-8' }));
  link.download = `timings-${id}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
  banner('ok', `已导出 ${id} 耗时数据（${measured.length}/${(data.jobs || []).length} 个任务）`);
}

function setAdvisor(ok) {
  $('advisor-dot').className = 'dot ' + (ok ? 'ok' : 'bad');
  $('advisor-text').textContent = ok ? 'advisor 正常' : 'advisor 不可达';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                                         '"': '&quot;', "'": '&#39;' }[c]));
}

function personLabel(name, email, fallback) {
  if (name && email) return `${name} (${email})`;
  return name || email || fallback;
}

function ownerCell(s) {
  const label = personLabel(s.owner_name, s.owner_email, s.owner_open_id || '');
  const same = s.organizer_open_id && s.organizer_open_id === s.owner_open_id;
  return `<td title="${escapeHtml(s.owner_open_id || '')}">${escapeHtml(label)}${same ? '（兼组织者）' : ''}</td>`;
}

function organizerCell(s) {
  if (!s.organizer_open_id) return '<td>—</td>';
  const label = personLabel(s.organizer_name, s.organizer_email, s.organizer_open_id);
  return `<td title="${escapeHtml(s.organizer_open_id)}">${escapeHtml(label)}</td>`;
}

function subsCell(s) {
  const subs = s.subscriptions || [];
  if (!subs.length) return '<td class="subs">—</td>';
  const items = subs.map((sub) => {
    const label = personLabel(sub.subscriber_name, sub.subscriber_email,
                              sub.subscriber_open_id || '');
    return `<div class="sub" title="${escapeHtml(sub.subscriber_open_id || '')}">` +
           `<span class="badge ${sub.state}">${sub.state}</span>` +
           `<span>${escapeHtml(label)}</span></div>`;
  });
  return `<td class="subs">${items.join('')}</td>`;
}

/* ---------------- supervisor grants ---------------- */
async function loadGrants() {
  let data = null;
  try {
    const resp = await fetch('api/supervisors');
    data = await resp.json();
    if (!resp.ok) throw new Error((data.error && data.error.message) || resp.status);
  } catch (err) {
    banner('err', '获取名单失败：' + err.message);
    return;
  }
  const rows = data.supervisors || [];
  const tbody = $('grant-rows');
  tbody.innerHTML = '';
  for (const g of rows) {
    const tr = document.createElement('tr');
    const stateBadge = g.enabled
      ? '<span class="badge on">启用</span>'
      : (g.open_id ? '<span class="badge off">停用</span>'
                   : '<span class="badge unresolved">未解析</span>');
    tr.innerHTML =
      `<td class="mono">${escapeHtml(g.login_name)}</td>` +
      `<td class="mono" title="${escapeHtml(g.open_id || '')}">${g.open_id ? escapeHtml(g.open_id) : '—'}</td>` +
      `<td>${stateBadge}</td>` +
      `<td>${fmtTs(g.updated_at)}</td>` +
      `<td>${g.enabled
        ? `<button class="btn" data-login="${escapeHtml(g.login_name)}" data-on="false">停用</button>`
        : `<button class="btn" data-login="${escapeHtml(g.login_name)}" data-on="true">启用</button>`}</td>`;
    tbody.appendChild(tr);
  }
  $('grant-empty').classList.toggle('hidden', rows.length > 0);
  for (const btn of tbody.querySelectorAll('button[data-login]')) {
    btn.onclick = () => putGrant(btn.dataset.login, btn.dataset.on === 'true');
  }
}

async function putGrant(login, enabled) {
  try {
    const resp = await fetch('api/supervisors', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login_name: login, enabled }) });
    const body = await resp.json();
    if (!resp.ok) throw new Error((body.error && body.error.message) || resp.status);
    banner('ok', `${login} 已${body.enabled ? '启用' : '停用'}（${body.open_id || '未解析'}）`);
  } catch (err) {
    banner('err', `${login} 配置失败：` + err.message);
  }
  loadGrants();
}

/* ---------------- settings ---------------- */
async function loadConfig() {
  let data = null;
  try {
    const resp = await fetch('api/config');
    data = await resp.json();
    if (!resp.ok) throw new Error((data.error && data.error.message) || resp.status);
  } catch (err) {
    banner('err', '获取设置失败：' + err.message);
    return;
  }
  $('idle-current').textContent = data.idle_timeout_s;
  $('idle-default').textContent = data.default_idle_timeout_s;
  $('idle-updated').textContent = data.updated_at
    ? `${fmtTs(data.updated_at)}（${escapeHtml(data.updated_by || '')}）` : '未修改';
  $('idle-input').value = data.idle_timeout_s;
}

async function saveIdleTimeout() {
  const value = Number($('idle-input').value);
  if (!Number.isInteger(value) || value < 60 || value > 86400) {
    banner('err', '无音频排空阈值须为 60–86400 的整数（秒）');
    return;
  }
  try {
    const resp = await fetch('api/config', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idle_timeout_s: value }) });
    const body = await resp.json();
    if (!resp.ok) throw new Error((body.error && body.error.message) || resp.status);
    banner('ok', `已保存：无音频排空阈值 = ${body.idle_timeout_s} 秒（仅对新会话生效）`);
  } catch (err) {
    banner('err', '保存失败：' + err.message);
  }
  loadConfig();
}

/* ---------------- logs ---------------- */
const KEYS = ['advisor', 'gateway', 'stt-server', 'bot', 'auth'];
const logLabel = (key) => key === 'stt-server' ? 'sst' : key;
let currentKey = null, source = null, paused = false, pending = [];

function buildLogTabs() {
  const tabs = $('log-tabs');
  tabs.innerHTML = '';
  for (const key of KEYS) {
    const btn = document.createElement('button');
    btn.textContent = logLabel(key);
    btn.dataset.key = key;
    btn.onclick = () => selectLog(key);
    tabs.appendChild(btn);
  }
}

async function markServices() {
  try {
    const resp = await fetch('api/services');
    const data = await resp.json();
    for (const svc of (data.services || [])) {
      const btn = document.querySelector(`#log-tabs button[data-key="${svc.key}"]`);
      if (!btn) continue;
      let dot = btn.querySelector('.dot');
      if (!dot) { dot = document.createElement('span'); dot.className = 'dot'; btn.appendChild(dot); }
      dot.className = 'dot ' + (svc.exists ? 'ok' : '');
    }
  } catch (err) { /* list is best-effort */ }
}

function setLogState(text) { $('log-state').textContent = text; }

function appendLog(text) {
  if (paused) { pending.push(text); if (pending.length > 2000) pending.shift(); return; }
  const pane = $('log-pane');
  pane.appendChild(document.createTextNode(text));
  if ($('autoscroll').checked) $('log-box').scrollTop = $('log-box').scrollHeight;
}

function flushPending() {
  for (const text of pending) {
    $('log-pane').appendChild(document.createTextNode(text));
  }
  pending = [];
  if ($('autoscroll').checked) $('log-box').scrollTop = $('log-box').scrollHeight;
}

function selectLog(key) {
  if (source) { source.close(); source = null; }
  currentKey = key;
  pending = [];
  $('log-pane').textContent = '';
  for (const btn of document.querySelectorAll('#log-tabs button'))
    btn.classList.toggle('active', btn.dataset.key === key);
  setLogState('connecting…');
  source = new EventSource(`api/logs/${encodeURIComponent(key)}/stream`);
  source.onopen = () => setLogState(`tail -f ${logLabel(key)} · 已连接`);
  source.onmessage = (event) => {
    try { appendLog(JSON.parse(event.data)); }
    catch (err) { appendLog(event.data); }
  };
  source.onerror = () => setLogState(`tail -f ${logLabel(key)} · 连接断开，重连中…`);
}

/* ---------------- tabs & wiring ---------------- */
function showView(name) {
  const sessions = name === 'sessions';
  const grants = name === 'grants';
  const settings = name === 'settings';
  $('view-sessions').classList.toggle('hidden', !sessions);
  $('view-grants').classList.toggle('hidden', !grants);
  $('view-settings').classList.toggle('hidden', !settings);
  $('view-logs').classList.toggle('hidden', sessions || grants || settings);
  $('tab-sessions').classList.toggle('active', sessions);
  $('tab-grants').classList.toggle('active', grants);
  $('tab-settings').classList.toggle('active', settings);
  $('tab-logs').classList.toggle('active', sessions || grants || settings ? false : true);
  $('banner').className = '';
  if (sessions) {
    loadSessions(false);
    sessionsTimer = setInterval(() => {
      if (!document.hidden && $('auto-refresh').checked) loadSessions(false);
    }, 5000);
  } else {
    clearInterval(sessionsTimer);
  }
  if (grants) loadGrants();
  if (settings) loadConfig();
  if (name === 'logs') {
    if (!currentKey) selectLog('advisor');
    markServices();
  }
}

$('tab-sessions').onclick = () => showView('sessions');
$('tab-grants').onclick = () => showView('grants');
$('tab-settings').onclick = () => showView('settings');
$('tab-logs').onclick = () => showView('logs');
$('idle-save').onclick = saveIdleTimeout;
$('grant-add').onclick = () => {
  const login = $('grant-login').value.trim();
  if (!login) { banner('err', '请输入账号标识'); return; }
  putGrant(login, true);
  $('grant-login').value = '';
};
$('refresh').onclick = () => loadSessions(true);
$('pause').onclick = () => {
  paused = !paused;
  $('pause').textContent = paused ? '继续' : '暂停';
  if (!paused) flushPending();
};
$('clear').onclick = () => { $('log-pane').textContent = ''; pending = []; };
for (const btn of document.querySelectorAll('#export-menu button')) {
  btn.onclick = () => {
    const id = exportSessionId;
    const format = btn.dataset.format;
    hideExportMenu();
    if (id) exportTranscript(id, format);
  };
}
document.addEventListener('click', (ev) => {
  if (!$('export-menu').classList.contains('hidden')
      && !ev.target.closest('#export-menu')
      && !ev.target.closest('button[data-export]')) hideExportMenu();
});

buildLogTabs();
showView('sessions');
</script>
