<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地会议字幕</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #2a3441;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4c9aff;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px 10px;
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .5px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted); flex: none;
    transition: background .2s, box-shadow .2s;
  }
  .dot.running { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.loading { background: var(--warn); animation: pulse 1s infinite; }
  .dot.error { background: var(--err); }
  @keyframes pulse { 50% { opacity: .25; } }
  .conn { margin-left: auto; font-size: 12px; color: var(--muted); }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 0 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  select, button {
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 11px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  select { max-width: 360px; }
  select:hover, button:hover { background: #232c3a; border-color: #3a4656; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.primary:hover { background: #2a7ff5; }
  button.danger { color: #ffb3b3; }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  .params {
    padding: 12px 20px 14px;
    border-bottom: 1px solid var(--border);
    background: #11161e;
  }
  .params-head {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    margin-bottom: 10px; font-size: 12px; color: var(--muted);
  }
  .params-head b { color: var(--text); font-size: 13px; font-weight: 600; }
  .params-head .upload { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .params-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
    gap: 6px 22px;
  }
  .prow {
    display: grid; grid-template-columns: 118px 1fr 74px 62px;
    align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
  }
  .prow .pname { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .prow input[type="number"], .prow select {
    width: 100%; padding: 4px 6px; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 5px; color: var(--text);
  }
  .prow input[type="number"] { font-variant-numeric: tabular-nums; }
  .prow .papply { font-size: 11px; text-align: right; opacity: .8; }
  .prow .papply.live { color: var(--ok); opacity: 1; }
  .prow input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
  input[type="file"] { display: none; }
  label.filebtn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 11px; cursor: pointer;
  }
  label.filebtn:hover { background: #232c3a; border-color: #3a4656; }

  .meter {
    display: flex; align-items: center; gap: 8px;
    margin-left: auto; min-width: 150px;
  }
  .meter .bar {
    flex: 1; height: 6px; border-radius: 3px;
    background: #10161f; overflow: hidden;
  }
  .meter .bar span {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--ok), var(--warn), var(--err));
    transition: width .08s linear;
  }

  main {
    flex: 1; overflow-y: auto; padding: 18px 20px 60px;
    scroll-behavior: smooth;
  }
  .line {
    display: flex; gap: 12px;
    padding: 7px 10px; margin-bottom: 4px;
    border-radius: 6px;
    line-height: 1.55;
    font-size: 20px;
    animation: fade .18s ease-out;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } }
  .line:hover { background: #121a24; }
  .line .time {
    flex: none; width: 52px; padding-top: 4px;
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .line .who {
    flex: none; min-width: 64px; padding-top: 3px;
    font-size: 13px; font-weight: 600;
  }
  .line .txt { flex: 1; word-break: break-word; white-space: pre-wrap; }

  #partial {
    color: #9fb0c3;
    font-style: italic;
    opacity: .85;
  }
  #partial .who { color: var(--muted) !important; }

  .empty {
    color: var(--muted); text-align: center; margin-top: 18vh; font-size: 15px; line-height: 1.9;
  }
  .empty kbd {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 6px; font-size: 13px;
  }

  footer {
    display: flex; flex-wrap: wrap; gap: 18px; row-gap: 4px; align-items: center;
    padding: 8px 20px; border-top: 1px solid var(--border);
    background: var(--panel); font-size: 12px; color: var(--muted);
    min-height: 36px;
  }
  footer b { color: var(--text); font-weight: 500; }
  footer .sp { margin-left: auto; }

  #toast {
    position: fixed; right: 20px; bottom: 52px;
    max-width: 480px;
    background: #2b1a1d; border: 1px solid var(--err);
    color: #ffdcdc; padding: 12px 16px; border-radius: 8px;
    font-size: 13px; line-height: 1.6;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast.warn { background: #2b2416; border-color: var(--warn); color: #ffe6b3; }

  #jump {
    position: fixed; right: 24px; bottom: 52px;
    display: none; border-radius: 20px; padding: 8px 16px;
    background: var(--accent); border: none; color: #fff; font-size: 13px;
  }
  #jump.show { display: block; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>本地会议字幕</h1>
  <span class="conn" id="conn">连接中…</span>
</header>

<div class="controls">
  <select id="device" title="音频输入设备"></select>
  <button id="refresh" title="刷新设备列表">刷新</button>
  <span class="sep"></span>
  <button id="start" class="primary">开始识别</button>
  <button id="procBtn" title="只抓飞书进程音频（远端发言）+ 麦克风（本人发言），不含其它软件声音">飞书进程</button>
  <button id="stop" disabled>停止</button>
  <span class="sep"></span>
  <button id="clear" class="danger">清空字幕</button>
  <button id="resetSpk" title="清空已学到的说话人">重置说话人</button>
  <button id="paramsBtn" title="识别参数设置">参数</button>
  <button id="winNative" title="Windows 原生识别（未接入）">Windows 原生</button>
  <div class="meter" title="输入电平">
    <div class="bar"><span id="level"></span></div>
  </div>
</div>

<div class="params" id="paramsPanel" hidden>
  <div class="params-head">
    <b>识别参数</b>
    <span>滑块或直接输入数值；标「实时」的改完立即生效，其余重建后生效</span>
    <span class="upload">
      <label class="filebtn">选择 WAV 音频<input type="file" id="file" accept=".wav,audio/wav,audio/x-wav"></label>
      <button id="uploadBtn">上传识别</button>
    </span>
  </div>
  <div class="params-grid" id="paramsGrid"></div>
</div>

<main id="scroller">
  <div class="empty" id="empty">
    选择音频设备后点「开始识别」<br>
    只想抓飞书会议声音：点 <kbd>飞书进程</kbd>，只收飞书 + 麦克风，不混入其它软件<br>
    <span style="font-size:13px">也可以选 <kbd>🔊 系统输出回环</kbd> 抓整个扬声器输出 · 全部本机离线运行</span>
  </div>
  <div id="lines"></div>
  <div class="line" id="partial" hidden>
    <span class="time"></span>
    <span class="who">…</span>
    <span class="txt"></span>
  </div>
</main>

<footer>
  <span>状态：<b id="stState">未启动</b></span>
  <span>设备：<b id="stDev">—</b></span>
  <span>句数：<b id="stCount">0</b></span>
  <span>说话人：<b id="stSpk">0</b></span>
  <span>版本：<b id="stVersion">—</b></span>
  <span>模型：<b id="stModel">—</b></span>
  <span>麦克风：<b id="stMic">—</b></span>
  <span>默认麦：<b id="stDefaultMic">—</b></span>
  <span>飞书麦：<b id="stMute">—</b></span>
  <span class="sp" id="stMsg"></span>
</footer>

<button id="jump">↓ 回到最新</button>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const scroller = $("scroller");
const linesEl = $("lines");
const partialEl = $("partial");
const MAX_LINES = 1500;
const PALETTE = ["#5aa9ff", "#ffb454", "#6ee7a8", "#ff8fa3", "#c084fc", "#34d3d3", "#f0dd6a", "#9aa8ff"];

let ws = null;
let retry = 0;
let stick = true;
let running = false;
let sentences = 0;
let sessDevice = null;

function colorFor(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function setDot(kind) {
  $("dot").className = "dot" + (kind ? " " + kind : "");
}

function toast(msg, warn) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "show" + (warn ? " warn" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (el.className = warn ? "warn" : ""), warn ? 6000 : 8000);
}

function setRunning(v) {
  running = v;
  $("start").disabled = v;
  $("stop").disabled = !v;
  $("device").disabled = v;
}

function scrollBottom() {
  if (stick) scroller.scrollTop = scroller.scrollHeight;
}

scroller.addEventListener("scroll", () => {
  stick = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 48;
  $("jump").classList.toggle("show", !stick);
});
$("jump").onclick = () => {
  stick = true;
  $("jump").classList.remove("show");
  scroller.scrollTop = scroller.scrollHeight;
};

function addFinal(d) {
  $("empty").style.display = "none";
  const row = document.createElement("div");
  row.className = "line";
  const t = document.createElement("span");
  t.className = "time";
  t.textContent = fmtTime(d.t1);
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = d.spk || "";
  who.style.color = colorFor(d.spk || "");
  const txt = document.createElement("span");
  txt.className = "txt";
  txt.textContent = d.text;
  row.append(t, who, txt);
  linesEl.appendChild(row);

  while (linesEl.children.length > MAX_LINES) linesEl.firstChild.remove();

  sentences = d.index || sentences + 1;
  $("stCount").textContent = sentences;
  scrollBottom();
}

function clearAll() {
  linesEl.innerHTML = "";
  hidePartial();
  sentences = 0;
  $("stCount").textContent = "0";
  $("empty").style.display = "";
}

function hidePartial() {
  partialEl.hidden = true;
  partialEl.querySelector(".txt").textContent = "";
  partialEl.querySelector(".time").textContent = "";
}

function showPartial(text) {
  $("empty").style.display = "none";
  partialEl.hidden = false;
  partialEl.querySelector(".time").textContent = "";
  partialEl.querySelector(".txt").textContent = text;
  scrollBottom();
}

function deviceKey(d) {
  return `${d.kind || "input"}|${d.id}`;
}

function deviceLabel(d) {
  if (d.kind === "loopback") return `🔊 ${d.name} [系统输出回环]`;
  return `${d.name} [${d.hostapi}]`;
}

function renderDevices(list, suggested) {
  const sel = $("device");
  const saved = localStorage.getItem("asr.device");
  sel.innerHTML = "";
  if (!list.length) {
    sel.innerHTML = '<option value="">（没有可用的输入设备）</option>';
    return;
  }
  for (const d of list) {
    const opt = document.createElement("option");
    opt.value = deviceKey(d);
    opt.textContent = deviceLabel(d);
    sel.appendChild(opt);
  }
  const suggestKey = suggested ? deviceKey(suggested) : "";
  const prefer = [saved, suggestKey, sessDevice].find(
    (v) => v && [...sel.options].some((o) => o.value === v)
  );
  if (prefer) sel.value = prefer;
  if (sel.value) {
    $("stDev").textContent = sel.options[sel.selectedIndex].textContent;
    sessDevice = sel.value;
  }
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  else toast("尚未连接到本地服务", true);
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    retry = 0;
    $("conn").textContent = "已连接本地服务";
    send({ cmd: "devices" });
    send({ cmd: "get_params" });
  };

  ws.onclose = () => {
    $("conn").textContent = "连接断开，重试中…";
    setDot("error");
    setRunning(false);
    retry = Math.min(retry + 1, 10);
    setTimeout(connect, 500 * retry);
  };

  ws.onerror = () => {
    $("conn").textContent = "连接异常";
  };

  ws.onmessage = (ev) => {
    let d;
    try { d = JSON.parse(ev.data); } catch { return; }

    if (d.type === "devices") {
      renderDevices(d.devices || [], d.suggested);
      return;
    }

    if (d.type === "params") {
      renderParams(d.specs || {}, d.values || {});
      return;
    }

    if (d.type === "mic") {
      renderMic(d.device, d.default);
      return;
    }

    if (d.type === "partial") {
      showPartial(d.text);
      return;
    }

    if (d.type === "final") {
      hidePartial();
      addFinal(d);
      return;
    }

    if (d.type === "clear") {
      clearAll();
      return;
    }

    if (d.type === "speakers") {
      $("stSpk").textContent = (d.names || []).length;
      return;
    }

    if (d.type === "level") {
      $("level").style.width = `${Math.round(Math.min(1, d.v || 0) * 100)}%`;
      return;
    }

    if (d.type === "vad") {
      if (running) setDot(d.speaking ? "running" : "loading");
      return;
    }

    if (d.type === "error") {
      toast(d.msg || "未知错误");
      setDot("error");
      setRunning(false);
      return;
    }

    if (d.type === "warning") {
      toast(d.msg || "警告", true);
      return;
    }

    if (d.type === "status") {
      if (d.version) {
        $("stVersion").textContent = d.version;
        document.title = `本地会议字幕 ${d.version}`;
      }
      // 单通道状态（remote/local）：只更新提示，不影响全局运行状态
      if (d.channel && d.channel !== "main") {
        if (d.mic_mute) {
          const mm = d.mic_mute;
          $("stMute").textContent = mm.known
            ? (mm.muted ? "静音（本地暂停）" : "开麦")
            : "未知（放行）";
          $("stMute").title = mm.detail || "";
        }
        $("stMsg").textContent = d.msg || "";
        if (d.msg) toast(d.msg, d.state === "error");
        return;
      }
      if (d.state === "running") {
        setDot("running");
        setRunning(true);
        $("stState").textContent = "识别中";
      } else if (d.state === "loading") {
        setDot("loading");
        $("stState").textContent = "加载模型";
      } else if (d.state === "error") {
        setDot("error");
        setRunning(false);
        $("stState").textContent = "异常";
      } else if (d.state === "idle" || d.state === "stopped") {
        setDot("");
        setRunning(false);
        $("stState").textContent = d.state === "stopped" ? "已停止" : "未启动";
      }
      if (d.samplerate) {
        const dev = $("device");
        const label = dev.selectedIndex >= 0 ? dev.options[dev.selectedIndex].textContent : "";
        $("stDev").textContent = `${label} · ${d.samplerate} Hz`;
      }
      if (typeof d.sentences === "number") $("stCount").textContent = d.sentences;
      if (Array.isArray(d.speakers)) $("stSpk").textContent = d.speakers.length;
      if (d.params) applyParamValues(d.params);
      if (d.model && d.model.asr_dir) {
        $("stModel").textContent = d.model.asr_dir.replace(/^sherpa-onnx-/, "");
      }
      if (d.mic_device !== undefined) renderMic(d.mic_device, d.default_mic);
      if (d.mic_mute) {
        const mm = d.mic_mute;
        $("stMute").textContent = mm.known
          ? (mm.muted ? "静音（本地暂停）" : "开麦")
          : "未知（放行）";
        $("stMute").title = mm.detail || "";
      }
      $("stMsg").textContent = d.msg || "";
      if (d.msg) toast(d.msg, d.state === "error");
      if (d.msg && (d.state === "running" || d.state === "loading")) hidePartial();
      return;
    }
  };
}

$("refresh").onclick = () => send({ cmd: "devices" });

$("device").onchange = () => {
  sessDevice = $("device").value;
  localStorage.setItem("asr.device", sessDevice);
  const sel = $("device");
  if (sel.selectedIndex >= 0) $("stDev").textContent = sel.options[sel.selectedIndex].textContent;
};

function currentDevicePayload() {
  const value = $("device").value;
  if (!value) return null;
  const idx = value.indexOf("|");
  const kind = value.slice(0, idx);
  const id = value.slice(idx + 1);
  return { kind, device: kind === "loopback" ? id : Number(id) };
}

$("start").onclick = () => {
  const payload = currentDevicePayload();
  if (!payload) {
    toast("没有可用音频设备", true);
    return;
  }
  hidePartial();
  stick = true;
  setDot("loading");
  $("stState").textContent = "启动中";
  send({ cmd: "start", mode: "sherpa", ...payload });
};

$("stop").onclick = () => send({ cmd: "stop" });

$("procBtn").onclick = () => {
  hidePartial();
  stick = true;
  setDot("loading");
  $("stState").textContent = "启动中";
  send({ cmd: "start", mode: "process" });
};
$("clear").onclick = () => send({ cmd: "clear" });
$("resetSpk").onclick = () => send({ cmd: "reset_speakers" });

// ---------------- 参数面板 ----------------
let paramSpecs = {};

let lastMic = null;
let lastDefaultMic = null;

function renderMic(dev, def) {
  if (dev !== undefined) lastMic = dev;
  // 枚举瞬时失败时后端可能给 null，保留上一次默认设备
  if (def !== undefined && def !== null) lastDefaultMic = def;

  const el = $("stMic");
  const d = lastMic;
  if (!d || !d.name) {
    el.textContent = "—";
    el.title = "";
  } else {
    const suffix = d.connected === false ? "（已断开）" : (d.running ? "" : "（已停止）");
    el.textContent = `${d.name}${suffix}`;
    el.title = `${d.hostapi || ""}${d.id !== undefined ? " #" + d.id : ""}`;
    el.style.color = d.connected === false ? "var(--warn)" : "";
  }

  const defEl = $("stDefaultMic");
  if (lastDefaultMic && lastDefaultMic.name) {
    defEl.textContent = lastDefaultMic.name;
    defEl.title = lastDefaultMic.id || "";
    defEl.style.color = (lastMic && lastMic.connected === false) ? "var(--warn)" : "";
  } else {
    defEl.textContent = "—";
    defEl.title = "";
    defEl.style.color = "";
  }
}

function fmtNum(v, spec) {
  if (spec.type === "int") return String(Math.round(Number(v)));
  const frac = String(spec.step ?? 0.01).split(".")[1] || "";
  return Number(v).toFixed(Math.min(3, frac.length));
}

function renderParams(specs, values) {
  const grid = $("paramsGrid");
  paramSpecs = specs || {};
  grid.innerHTML = "";
  for (const [name, spec] of Object.entries(paramSpecs)) {
    const row = document.createElement("div");
    row.className = "prow";
    row.title = `${spec.desc || ""}`;

    const label = document.createElement("span");
    label.className = "pname";
    label.textContent = spec.label || name;

    const value = values && name in values ? values[name] : spec.default;

    if (spec.type === "bool") {
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = !!value;
      box.dataset.name = name;
      box.onchange = () => send({ cmd: "set_param", name, value: box.checked });
      const spacer = document.createElement("span");
      const badge = document.createElement("span");
      badge.className = "papply" + (spec.apply === "实时" ? " live" : "");
      badge.textContent = spec.apply || "";
      row.append(label, box, spacer, badge);
    } else if (spec.type === "choice") {
      const sel = document.createElement("select");
      sel.dataset.name = name;
      for (const opt of spec.options || []) {
        const o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        sel.appendChild(o);
      }
      sel.value = value;
      sel.onchange = () => send({ cmd: "set_param", name, value: sel.value });
      const spacer = document.createElement("span");
      const badge = document.createElement("span");
      badge.className = "papply" + (spec.apply === "实时" ? " live" : "");
      badge.textContent = spec.apply || "";
      row.append(label, sel, spacer, badge);
    } else {
      const range = document.createElement("input");
      range.type = "range";
      range.min = spec.min;
      range.max = spec.max;
      range.step = spec.step;
      range.value = value;
      range.dataset.name = name;

      const num = document.createElement("input");
      num.type = "number";
      num.min = spec.min;
      num.max = spec.max;
      num.step = spec.step;
      num.value = fmtNum(value, spec);
      num.dataset.name = name;

      range.oninput = () => { num.value = fmtNum(range.value, spec); };
      range.onchange = () => {
        num.value = fmtNum(range.value, spec);
        send({ cmd: "set_param", name, value: Number(range.value) });
      };
      num.onchange = () => {
        const v = Number(num.value);
        if (!isFinite(v)) { num.value = fmtNum(range.value, spec); return; }
        range.value = v;
        send({ cmd: "set_param", name, value: v });
      };

      const badge = document.createElement("span");
      badge.className = "papply" + (spec.apply === "实时" ? " live" : "");
      badge.textContent = spec.apply || "";

      row.append(label, range, num, badge);
    }
    grid.appendChild(row);
  }
}

function applyParamValues(values) {
  if (!values) return;
  for (const el of $("paramsGrid").querySelectorAll("[data-name]")) {
    const name = el.dataset.name;
    if (!(name in values)) continue;
    const v = values[name];
    if (el.type === "checkbox") el.checked = !!v;
    else if (el.type === "range") {
      el.value = v;
      const num = el.parentElement.querySelector('input[type="number"]');
      if (num) num.value = fmtNum(v, paramSpecs[name] || { type: "float", step: 0.01 });
    } else if (el.type === "number") {
      el.value = fmtNum(v, paramSpecs[name] || { type: "float", step: 0.01 });
    } else if (el.tagName === "SELECT") {
      el.value = v;
    }
  }
}

$("paramsBtn").onclick = () => {
  const panel = $("paramsPanel");
  panel.hidden = !panel.hidden;
  if (!panel.hidden && !Object.keys(paramSpecs).length) send({ cmd: "get_params" });
};

// ---------------- 上传音频识别 ----------------
$("uploadBtn").onclick = async () => {
  const file = $("file").files[0];
  if (!file) { toast("请先选择 WAV 文件", true); return; }
  const btn = $("uploadBtn");
  btn.disabled = true;
  $("stState").textContent = "转写中";
  try {
    const buf = await file.arrayBuffer();
    const res = await fetch("/api/transcribe", {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body: buf,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    clearAll();
    for (const seg of data.segments || []) addFinal(seg);
    $("stSpk").textContent = (data.speakers || []).length;
    toast(`转写完成：${(data.segments || []).length} 句 / ${data.duration}s`);
  } catch (e) {
    toast("转写失败：" + e.message, true);
  } finally {
    btn.disabled = false;
    $("stState").textContent = running ? "识别中" : "未启动";
  }
};
$("winNative").onclick = () => {
  const payload = currentDevicePayload() || {};
  send({ cmd: "start", mode: "win_native", ...payload });
};

// 定期刷新状态，防止页面长时间挂起后状态不一致
setInterval(() => { if (!running) send({ cmd: "status" }); }, 15000);

connect();
</script>
</body>
