[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recorder"
version = "0.1.0"
description = "Laptop capture agent: dual-source audio, stream-token WS uplink"
requires-python = ">=3.11"
dependencies = ["sounddevice>=0.5", "websockets>=17,<18"]

[project.optional-dependencies]
dev = ["coverage==7.16.2", "pyright==1.1.414", "ruff==0.17.0", "numpy>=2"]
windows = ["numpy>=2", "soundcard>=0.4", "process-audio-capture==1.0.0", "uiautomation==2.0.29"]

[project.scripts]
recorder = "recorder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recorder = ["audio/*.swift"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["src/recorder"]
# Windows-only capture backends import ctypes.windll plus win32 packages from
# the [windows] extra; they cannot be resolved on the Linux/macOS CI runners.
# They are exercised by the Windows build workflow instead.
exclude = [
    "src/recorder/audio/windows_loopback.py",
    "src/recorder/audio/windows_mic.py",
    "src/recorder/audio/windows_mute.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["recorder"]

[tool.coverage.report]
excludeAlso = ["if __name__ == .__main__.:", "if TYPE_CHECKING:", '\.\.\.']
