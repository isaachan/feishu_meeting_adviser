[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-studio"
version = "0.1.0"
description = "Local replay harness: feed admin TXT transcripts into a real advisor for prompt iteration"
requires-python = ">=3.11"
dependencies = ["websockets>=17,<18"]

[project.optional-dependencies]
dev = ["coverage==7.16.2", "pyright==1.1.414", "ruff==0.17.0"]

[project.scripts]
prompt-studio = "prompt_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_studio = ["static/*.html"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["src/prompt_studio"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["prompt_studio"]

[tool.coverage.report]
excludeAlso = ["if __name__ == .__main__.:", "if TYPE_CHECKING:", '\.\.\.']
