[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-spectator"
version = "0.1.0"
description = "Feishu spectator mode: captions and in-meeting chat via user identity, no bot joins"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
    "coverage==7.16.2",
    "ruff==0.17.0",
]

[project.scripts]
feishu-spectator = "feishu_spectator.__main__:main"
feishu-spectator-oauth = "feishu_spectator.oauth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["feishu_spectator"]
