name: legacy module quality (manual)

# 方案 B（legacy/，2026-11-10 停维）——仅供参考的历史资产。
# 不再随 push/PR 触发；需要验证 legacy 改动时手动 workflow_dispatch。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [advisor, meeting-listener, local-meeting-recorder, llm-gateway]
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: legacy/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: legacy/${{ matrix.module }}/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - if: matrix.module == 'meeting-listener'
        run: ruff check scripts
      - run: pyright
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --show-missing
      - if: matrix.module == 'meeting-listener'
        run: python -m unittest discover -s reference/spike/tests -v

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            legacy/advisor/pyproject.toml
            legacy/meeting-listener/pyproject.toml
            legacy/local-meeting-recorder/pyproject.toml
            legacy/llm-gateway/pyproject.toml
      - run: python -m pip install -e './legacy/advisor[dev]' -e ./legacy/meeting-listener -e ./legacy/local-meeting-recorder -e ./legacy/llm-gateway
      - run: ruff check --config legacy/advisor/pyproject.toml legacy/integrations
      - run: python -m unittest discover -s legacy/integrations -v
