name: Windows GUI build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Stamp timestamp
        id: timestamp
        shell: powershell
        run: 'echo "stamp=$(Get-Date -Format ''yyyyMMdd-HHmmss'')" >> $env:GITHUB_OUTPUT'
      - name: Build Windows app
        shell: powershell
        run: ./windows-gui/build.ps1 -Stamp "${{ steps.timestamp.outputs.stamp }}"
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: MeetingAdvisor-windows-x64-${{ steps.timestamp.outputs.stamp }}
          path: windows-gui/dist/MeetingAdvisor/
          if-no-files-found: error
