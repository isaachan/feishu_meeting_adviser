name: macOS GUI build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp timestamp
        id: timestamp
        run: 'echo "stamp=$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"'
      - name: Build macOS app
        run: ./macos-gui/build.sh
      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: MeetingAdvisor-macos-arm64-${{ steps.timestamp.outputs.stamp }}
          path: macos-gui/dist/MeetingAdvisor-macos-arm64.zip
          if-no-files-found: error
