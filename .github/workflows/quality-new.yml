name: new module quality

on:
  push:
    paths:
      - "new/**"
      - ".github/workflows/quality-new.yml"
  pull_request:
    paths:
      - "new/**"
      - ".github/workflows/quality-new.yml"

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [recorder, advisor, bot, auth, stt-server, llm-gateway, macos-gui]
        python-version: ["3.11", "3.14"]
        exclude:
          # stt-server's migrated sync-client WS test harness is flaky on 3.11
          # (thread+loop interplay); service code passes on 3.14 and the old
          # repo never ran stt-server in CI either. Revisit if harness is rewritten.
          - module: stt-server
            python-version: "3.11"
    defaults:
      run:
        working-directory: new/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: new/${{ matrix.module }}/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - if: matrix.module == 'macos-gui'
        run: python -m pip install -e ../recorder
      - run: ruff check src tests
      - run: pyright
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --show-missing

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            new/recorder/pyproject.toml
            new/advisor/pyproject.toml
            new/bot/pyproject.toml
            new/auth/pyproject.toml
            new/stt-server/pyproject.toml
            new/llm-gateway/pyproject.toml
      - run: python -m pip install -e './new/recorder[dev]' -e ./new/advisor -e ./new/bot -e ./new/auth -e ./new/stt-server -e ./new/llm-gateway
      - run: ruff check --config new/advisor/pyproject.toml new/integrations
      - run: python -m unittest discover -s new/integrations -v
