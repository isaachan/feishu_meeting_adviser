name: module quality

on:
  push:
    paths:
      - "advisor/**"
      - "meeting-listener/**"
      - "local-meeting-recorder/**"
      - "llm-gateway/**"
      - "integrations/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "advisor/**"
      - "meeting-listener/**"
      - "local-meeting-recorder/**"
      - "llm-gateway/**"
      - "integrations/**"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [advisor, meeting-listener, local-meeting-recorder, llm-gateway]
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - if: matrix.module == 'meeting-listener'
        run: ruff check scripts
      - run: pyright
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --show-missing
      - if: matrix.module == 'meeting-listener'
        run: python -m unittest discover -s reference/spike/tests -v

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            advisor/pyproject.toml
            meeting-listener/pyproject.toml
            local-meeting-recorder/pyproject.toml
            llm-gateway/pyproject.toml
      - run: python -m pip install -e './advisor[dev]' -e ./meeting-listener -e ./local-meeting-recorder -e ./llm-gateway
      - run: ruff check --config advisor/pyproject.toml integrations
      - run: python -m unittest discover -s integrations -v
