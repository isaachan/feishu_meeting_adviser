name: module quality

on:
  push:
    paths:
      - "advisor/**"
      - "auth/**"
      - "bot/**"
      - "recorder/**"
      - "stt-server/**"
      - "llm-gateway/**"
      - "macos-gui/**"
      - "admin-site/**"
      - "integrations/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "advisor/**"
      - "auth/**"
      - "bot/**"
      - "recorder/**"
      - "stt-server/**"
      - "llm-gateway/**"
      - "macos-gui/**"
      - "admin-site/**"
      - "integrations/**"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [recorder, advisor, bot, auth, stt-server, llm-gateway, macos-gui, admin-site]
        python-version: ["3.11", "3.14"]
        exclude:
          # stt-server's migrated sync-client WS test harness is flaky on 3.11
          # (thread+loop interplay); service code passes on 3.14 and the old
          # repo never ran stt-server in CI either. Revisit if harness is rewritten.
          - module: stt-server
            python-version: "3.11"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - if: matrix.module == 'macos-gui'
        run: python -m pip install -e ../recorder
      - run: ruff check src tests
      - run: pyright
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --show-missing

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            recorder/pyproject.toml
            advisor/pyproject.toml
            bot/pyproject.toml
            auth/pyproject.toml
            stt-server/pyproject.toml
            llm-gateway/pyproject.toml
            admin-site/pyproject.toml
      - run: python -m pip install -e './recorder[dev]' -e ./advisor -e ./bot -e ./auth -e ./stt-server -e ./llm-gateway
      - run: ruff check --config advisor/pyproject.toml integrations
      - run: python -m unittest discover -s integrations -v
