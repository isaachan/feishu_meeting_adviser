[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth"
version = "0.1.0"
description = "OAuth credential service holding per-user Feishu tokens"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["coverage==7.16.2", "pyright==1.1.414", "ruff==0.17.0"]

[project.scripts]
auth = "auth.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["src/auth"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["auth"]

[tool.coverage.report]
excludeAlso = ["if __name__ == .__main__.:", "if TYPE_CHECKING:", '\.\.\.']
