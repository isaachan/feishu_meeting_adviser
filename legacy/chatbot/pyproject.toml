[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-simple-chatbot"
version = "0.1.0"
description = "Simple Feishu chat bot backed by OpenCode"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "lark-oapi>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["chatbot*"]
