<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">飞书会议会参谋</title>
  <desc id="desc">深蓝底上的两层对话气泡、实时语音波形和智能建议星芒。</desc>
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192D66"/>
      <stop offset="55%" stop-color="#132255"/>
      <stop offset="100%" stop-color="#0B1535"/>
    </linearGradient>
    <radialGradient id="ambient" cx="25%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#4C83E8" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#4C83E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="conversation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BE2EB"/>
      <stop offset="47%" stop-color="#4A9BFA"/>
      <stop offset="100%" stop-color="#5665E9"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9F1FF"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6AD9EC"/>
      <stop offset="50%" stop-color="#3976EB"/>
      <stop offset="100%" stop-color="#7371ED"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#ambient)"/>

  <!-- The meeting conversation sits behind the adviser's response. -->
  <path d="M704 586h98v109c0 17 20 26 33 15l68-65V338c0-83-67-150-150-150H394c-83 0-150 67-150 150v248z" fill="#081533" opacity=".32"/>
  <path d="M704 570h96v109c0 17 20 26 33 15l68-65V322c0-83-67-150-150-150H392c-83 0-150 67-150 150v248z" fill="url(#conversation)"/>

  <!-- One precise glint instead of a cluster of decorative stars. -->
  <path d="M737 236c8 37 26 55 63 63-37 8-55 26-63 63-8-37-26-55-63-63 37-8 55-26 63-63z" fill="#FFF"/>

  <!-- Live captions and a voice pulse inside the reply. -->
  <path d="M252 778v94c0 16 18 25 31 15l128-99" fill="#C5D5F6" opacity=".4"/>
  <rect x="160" y="355" width="637" height="432" rx="112" fill="#07173B" opacity=".25"/>
  <path d="M248 760v94c0 16 18 25 31 15l128-99" fill="url(#paper)"/>
  <rect x="160" y="339" width="637" height="432" rx="112" fill="url(#paper)"/>

  <g fill="url(#wave)">
    <rect x="255" y="502" width="29" height="42" rx="14.5"/>
    <rect x="303" y="475" width="29" height="96" rx="14.5"/>
    <rect x="351" y="444" width="29" height="158" rx="14.5"/>
    <rect x="399" y="463" width="29" height="120" rx="14.5"/>
    <rect x="447" y="486" width="29" height="74" rx="14.5"/>
    <rect x="495" y="453" width="29" height="140" rx="14.5"/>
    <rect x="543" y="475" width="29" height="96" rx="14.5"/>
    <rect x="591" y="501" width="29" height="44" rx="14.5"/>
  </g>
  <rect x="256" y="646" width="358" height="25" rx="12.5" fill="#A9BDE5"/>
  <rect x="634" y="646" width="67" height="25" rx="12.5" fill="#D5E0F5"/>
</svg>
